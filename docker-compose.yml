services:
  bot:
    build: .
    container_name: socialvideodownload
    env_file: .env
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./downloads:/data/downloads
      - ./logs:/data/logs
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
