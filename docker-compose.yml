services:
  bot:
    build: .
    container_name: socialvideodownload
    env_file: .env
    # root comme le bot Python : ./downloads, ./logs et ./state créés par l'hôte sont inscriptibles
    # sans chown (rootless Podman : root du conteneur = ton utilisateur). Le reste du durcissement
    # (lecture seule, cap_drop ALL, no-new-privileges) est conservé.
    user: "0:0"
    read_only: true
    tmpfs:
      # exec : le yt-dlp officiel (PyInstaller) s'extrait dans /tmp et y charge ses bibliothèques
      - /tmp:exec,mode=1777
    volumes:
      - ./downloads:/data/downloads
      - ./logs:/data/logs
      # réglages de /settings : survivent aux mises à jour de l'image (système de fichiers en lecture seule)
      - ./state:/data/state
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
